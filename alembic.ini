# A generic, single database configuration.

[alembic]
script_location = %(here)s/alembic

prepend_sys_path = .

# IMPORTANT: DO NOT rely on this in production multi-tenant system
# It will be overridden in env.py dynamically
sqlalchemy.url = mssql+pyodbc://sa:abcd123%21@DESKTOP-BMKMV1T\SQLEXPRESS/onelinedb?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes

path_separator = os


[post_write_hooks]
# hooks disabled for now (can enable black/ruff later)


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S